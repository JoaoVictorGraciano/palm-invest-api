spring.application.name=palm-invest-api
# Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/palm_invest
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurações do Hibernate (JPA)
# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere entidade x banco na subida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Sem sessao JPA aberta durante a requisicao: acesso lazy fora de transacao falha cedo em vez de gerar consultas escondidas
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Token JWT (chave em Base64 com pelo menos 256 bits, vinda do ambiente)
api.security.token.secret=${JWT_SECRET}
api.security.token.expiracao-horas=${JWT_EXPIRATION_HOURS:2}

# CORS: origens do Front liberadas (separe várias por vírgula)
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Provedores de cotação e busca de ativos. As chaves são opcionais: sem elas valem os limites gratuitos.
# Vão só em header (Brapi: Authorization Bearer; CoinGecko Demo: x-cg-demo-api-key) e nunca são registradas em log.
api.cotacoes.brapi.url=https://brapi.dev/api
api.cotacoes.brapi.token=${BRAPI_TOKEN:}
api.cotacoes.coingecko.url=https://api.coingecko.com/api/v3
api.cotacoes.coingecko.api-key=${COINGECKO_API_KEY:}
api.cotacoes.timeout-conexao=3s
api.cotacoes.timeout-leitura=8s
# Cache em memória, compartilhado entre todos os usuários (formato de duração: 30m, 5m, 24h, 90s)
# Ações: o plano gratuito da Brapi já tem ~30 min de atraso. Cripto: todas as moedas pedidas numa única chamada.
api.cotacoes.cache.cotacao-acoes=${CACHE_COTACAO_ACOES:30m}
api.cotacoes.cache.cotacao-cripto=${CACHE_COTACAO_CRIPTO:5m}
api.cotacoes.cache.busca=${CACHE_BUSCA:10m}
api.cotacoes.cache.id-cripto=${CACHE_ID_CRIPTO:24h}

# Flyway: em banco que já tem as tabelas (criadas antes do Flyway), marca V1 como aplicada sem executá-la
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema existente antes do Flyway