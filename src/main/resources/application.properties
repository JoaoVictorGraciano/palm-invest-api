spring.application.name=palm-invest-api
# Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/palm_invest
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurações do Hibernate (JPA)
# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere entidade x banco na subida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Sem sessao JPA aberta durante a requisicao: acesso lazy fora de transacao falha cedo em vez de gerar consultas escondidas
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Token JWT (chave em Base64 com pelo menos 256 bits, vinda do ambiente)
api.security.token.secret=${JWT_SECRET}
api.security.token.expiracao-horas=${JWT_EXPIRATION_HOURS:2}

# CORS: origens do Front liberadas (separe várias por vírgula)
api.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Flyway: em banco que já tem as tabelas (criadas antes do Flyway), marca V1 como aplicada sem executá-la
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema existente antes do Flyway