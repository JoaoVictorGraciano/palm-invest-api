# Perfil "test": banco H2 em memória, recriado a cada execução.
# A URL do banco e a chave JWT são definidas em IntegracaoTestBase (@DynamicPropertySource),
# para que nada de fora (variável de ambiente, outro properties) aponte os testes para o Postgres real.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
